{% extends "base.html" %} {% block title %}Chat - Medical Triage Hub{% endblock
%} {% block content %}
<div class="drawer lg:drawer-open h-[calc(100vh-4rem)]">
  <input id="chat-drawer" type="checkbox" class="drawer-toggle" />

  <!-- Main Chat Area -->
  <div class="drawer-content flex flex-col h-full bg-base-100 relative">
    <!-- Mobile toggle -->
    <div class="lg:hidden p-2 border-b">
      <label for="chat-drawer" class="btn btn-sm btn-ghost drawer-button">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          class="inline-block w-5 h-5 stroke-current"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
        Chats
      </label>
    </div>

    <div
      id="chat-container"
      class="flex-1 flex flex-col h-full overflow-hidden relative"
    >
      <!-- Chat Window UI -->
      <div
        id="active-channel-header"
        class="bg-base-200 p-4 border-b font-bold hidden"
      >
        Select a chat to start messaging
      </div>

      <div id="messages-area" class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex items-center justify-center h-full text-gray-500">
          Select a channel from the sidebar
        </div>
      </div>

      <div id="input-area" class="p-4 bg-base-200 hidden">
        <div class="join w-full">
          <input
            type="text"
            id="message-input"
            class="input input-bordered join-item w-full"
            placeholder="Type a message..."
          />
          <button class="btn btn-primary join-item" onclick="sendMessage()">
            Send
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar Channel List -->
  <div class="drawer-side h-full z-20">
    <label for="chat-drawer" class="drawer-overlay"></label>
    <ul
      class="menu p-0 w-80 min-h-full bg-base-200 text-base-content border-r border-base-300"
    >
      <div class="p-4 bg-base-300 font-bold text-lg sticky top-0 z-10">
        Chats
      </div>
      <div id="channel-list" class="overflow-y-auto">
        <!-- Channels injected here -->
        <div class="flex justify-center p-4">
          <span class="loading loading-spinner"></span>
        </div>
      </div>
    </ul>
  </div>
</div>

<!-- Stream Chat SDK -->
<script src="https://cdn.jsdelivr.net/npm/stream-chat/dist/browser.full-bundle.min.js"></script>
<script>
  let chatClient;
  let activeChannel;
  const userEmail = "{{ user.email }}";

  async function initChat() {
    const apiKey = "{{ stream_api_key }}";
    // Get token
    try {
      const res = await fetch("/chat/token");
      const data = await res.json();

      // For browser bundle, it is usually exposed as StreamChat
      chatClient = new StreamChat(apiKey);
      await chatClient.connectUser(
        {
          id: data.userId,
          name: userEmail,
        },
        data.token,
      );

      // Fetch Channels
      const filter = { type: "messaging", members: { $in: [data.userId] } };
      const sort = { last_message_at: -1 };
      const channels = await chatClient.queryChannels(filter, sort, {
        watch: true,
        state: true,
      });

      renderChannelList(channels);

      // Listen for new messages in active channel
      chatClient.on("message.new", (event) => {
        if (activeChannel && event.channel_id === activeChannel.id) {
          appendMessage(event.message);
        }
        // Refresh list to update unread/last message
        // In a real app we'd update DOM efficiently
      });
    } catch (e) {
      console.error("Chat Init Error", e);
    }
  }

  function renderChannelList(channels) {
    const listContainer = document.getElementById("channel-list");
    listContainer.innerHTML = "";

    if (channels.length === 0) {
      listContainer.innerHTML =
        '<div class="p-4 text-center text-sm">No chats yet</div>';
      return;
    }

    channels.forEach((channel) => {
      const el = document.createElement("li");
      const data = channel.data || {};
      const name = data.name || channel.id;
      const preview =
        channel.state.messages[channel.state.messages.length - 1]?.text ||
        "No messages";

      el.innerHTML = `
                <a onclick="selectChannel('${channel.id}')" class="flex flex-col gap-1 py-3 items-start">
                    <span class="font-bold">${name}</span>
                    <span class="text-xs text-gray-500 truncate w-full">${preview}</span>
                </a>
            `;
      listContainer.appendChild(el);
    });
  }

  async function selectChannel(channelId) {
    if (!chatClient) return;

    const channel = chatClient.channel("messaging", channelId);
    await channel.watch();
    activeChannel = channel;

    // UI Update
    document.getElementById("active-channel-header").classList.remove("hidden");
    document.getElementById("active-channel-header").innerText =
      channel.data.name || "Chat";
    document.getElementById("input-area").classList.remove("hidden");

    renderMessages(channel.state.messages);

    // Auto scroll
    const msgArea = document.getElementById("messages-area");
    msgArea.scrollTop = msgArea.scrollHeight;
  }

  function renderMessages(messages) {
    const area = document.getElementById("messages-area");
    area.innerHTML = "";
    messages.forEach(appendMessage);
  }

  function appendMessage(msg) {
    const area = document.getElementById("messages-area");
    const isMe = msg.user.id === chatClient.userID;

    const el = document.createElement("div");
    el.className = `chat ${isMe ? "chat-end" : "chat-start"}`;
    el.innerHTML = `
            <div class="chat-header">
                ${msg.user.name || msg.user.id}
            </div>
            <div class="chat-bubble ${isMe ? "chat-bubble-primary" : "chat-bubble-secondary"}">
                ${msg.text}
            </div>
        `;
    area.appendChild(el);
    area.scrollTop = area.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text || !activeChannel) return;

    try {
      await activeChannel.sendMessage({ text });
      input.value = "";
    } catch (e) {
      console.error(e);
    }
  }

  // Bind Enter key
  document
    .getElementById("message-input")
    .addEventListener("keypress", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

  initChat();
</script>
{% endblock %}
