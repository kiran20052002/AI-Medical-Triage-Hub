<div
  id="chatbot-widget"
  class="fixed bottom-6 right-6 z-50 flex flex-col items-end pointer-events-none"
>
  <!-- Chat Window -->
  <div
    id="chat-window"
    class="hidden pointer-events-auto bg-base-100 rounded-2xl shadow-2xl w-80 sm:w-96 h-[600px] mb-4 flex flex-col overflow-hidden border border-base-300 transition-all duration-300 ease-in-out transform origin-bottom-right"
  >
    <!-- Header -->
    <div
      class="bg-gradient-to-r from-indigo-500 to-indigo-700 p-4 flex justify-between items-center text-white"
    >
      <div class="flex items-center gap-2">
        <button
          onclick="toggleSessions()"
          class="hover:bg-white/20 p-1 rounded-full transition-colors -ml-1 mr-1"
          title="Recent Sessions"
        >
          <!-- Hamburger (3 dashes) Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>
        <div class="bg-white/20 p-1.5 rounded-full">
          <!-- Bot Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 8V4H8" />
            <rect width="16" height="12" x="4" y="8" rx="2" />
            <path d="M2 14h2" />
            <path d="M20 14h2" />
            <path d="M15 13v2" />
            <path d="M9 13v2" />
          </svg>
        </div>
        <h3 class="font-semibold text-lg">Medical Assistant</h3>
      </div>
      <div class="flex items-center gap-1">
        <button
          onclick="startNewChat()"
          class="hover:bg-white/20 p-1 rounded-full transition-colors"
          title="New Chat"
        >
          <!-- Plus Circle Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="16" />
            <line x1="8" y1="12" x2="16" y2="12" />
          </svg>
        </button>
        <a
          href="/chatbot/"
          class="hover:bg-white/20 p-1 rounded-full transition-colors"
          title="Open Full Page View"
        >
          <!-- External Link Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
            />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
        </a>
        <button
          onclick="toggleMaximize()"
          title="Expand"
          class="hover:bg-white/20 p-1 rounded-full text-white text-xs"
        >
          <!-- Expand Icon (Custom) -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
        <button
          onclick="toggleChat()"
          class="hover:bg-white/20 p-1 rounded-full transition-colors"
        >
          <!-- X Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="M6 6 18 18" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div
      id="chat-messages"
      class="flex-1 p-4 overflow-y-auto bg-base-200 space-y-3"
    >
      <!-- Initial Message -->
      <div class="flex w-full justify-start">
        <div
          class="max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap bg-base-100 text-base-content border border-base-300 rounded-bl-none"
        >
          Hello! I am your medical assistant. How can I help you today?
        </div>
      </div>
    </div>

    <!-- Sessions Overlay -->
    <div
      id="sessions-overlay"
      class="hidden absolute inset-0 bg-base-100 z-20 flex flex-col pt-16"
    >
      <div
        class="px-4 py-2 border-b border-base-300 flex justify-between items-center text-sm font-bold bg-base-200"
      >
        <span>Recent Sessions</span>
        <button
          onclick="toggleSessions()"
          class="text-xs hover:underline text-indigo-600"
        >
          Back
        </button>
      </div>
      <div id="sessions-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <!-- Sessions list will be populated here -->
      </div>
    </div>
    <div class="p-4 bg-base-100 border-t border-base-300">
      <form
        id="rag-chat-form"
        class="flex gap-2"
        onsubmit="handleRagSubmit(event)"
      >
        <input
          type="text"
          id="rag-input"
          class="flex-1 bg-base-200 text-base-content px-4 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 border border-transparent transition-all"
          placeholder="Ask a health question..."
          required
          autocomplete="off"
        />
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white p-2.5 rounded-xl transition-all duration-200 shadow-md hover:shadow-lg flex-shrink-0"
        >
          <!-- Send Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m22 2-7 20-4-9-9-4Z" />
            <path d="M22 2 11 13" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Toggle Button -->
  <button
    id="toggle-btn"
    onclick="toggleChat()"
    class="pointer-events-auto bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-xl hover:shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center group"
  >
    <!-- MessageCircle Icon (Default) -->
    <svg
      id="icon-open"
      xmlns="http://www.w3.org/2000/svg"
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
    </svg>
    <!-- X Icon (Hidden by default, swapped in JS) -->
    <svg
      id="icon-close"
      class="hidden"
      xmlns="http://www.w3.org/2000/svg"
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 6 6 18" />
      <path d="M6 6 18 18" />
    </svg>
  </button>
</div>

<script>
  let currentThreadId = localStorage.getItem("chatbot_thread_id");
  if (!currentThreadId) {
    currentThreadId = "widget-" + Math.random().toString(36).substring(2, 11);
    localStorage.setItem("chatbot_thread_id", currentThreadId);
  }

  let isMaximized = false;
  let isOpen = false;
  let isStreaming = false;

  async function toggleChat() {
    const win = document.getElementById("chat-window");
    const iconOpen = document.getElementById("icon-open");
    const iconClose = document.getElementById("icon-close");

    isOpen = !isOpen;
    if (isOpen) {
      win.classList.remove("hidden");
      iconOpen.classList.add("hidden");
      iconClose.classList.remove("hidden");

      // Load history if it's the first time opening
      if (document.getElementById("chat-messages").children.length <= 1) {
        loadHistory();
      }
    } else {
      win.classList.add("hidden");
      iconOpen.classList.remove("hidden");
      iconClose.classList.add("hidden");
      // Close overlay if open when widget closed
      document.getElementById("sessions-overlay").classList.add("hidden");
    }
  }

  function toggleSessions() {
    const overlay = document.getElementById("sessions-overlay");
    overlay.classList.toggle("hidden");
    if (!overlay.classList.contains("hidden")) {
      loadSessions();
    }
  }

  async function loadSessions() {
    const list = document.getElementById("sessions-list");
    list.innerHTML =
      '<div class="p-4 text-center"><span class="loading loading-spinner text-indigo-600"></span></div>';

    try {
      const res = await fetch("/chatbot/threads");
      const data = await res.json();
      renderSessions(data.threads);
    } catch (e) {
      console.error("Failed to load sessions", e);
      list.innerHTML =
        '<div class="p-4 text-center text-xs text-red-500">Error loading sessions</div>';
    }
  }

  function renderSessions(threads) {
    const list = document.getElementById("sessions-list");
    list.innerHTML = "";

    if (!threads || threads.length === 0) {
      list.innerHTML =
        '<div class="p-4 text-center text-xs opacity-50">No recent sessions</div>';
      return;
    }

    threads.reverse().forEach((tid) => {
      const isActive = currentThreadId === tid;
      const item = document.createElement("button");
      item.className = `w-full text-left p-3 rounded-xl transition-all border mb-1 flex items-center gap-3 ${
        isActive
          ? "bg-indigo-600 text-white border-indigo-600 shadow-md"
          : "hover:bg-base-200 border-transparent text-base-content opacity-80 hover:opacity-100"
      }`;
      item.onclick = () => switchSession(tid);

      item.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${isActive ? "text-white" : "text-indigo-500"}"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="truncate font-medium text-xs">${tid}</span>
          `;
      list.appendChild(item);
    });
  }

  function switchSession(tid) {
    currentThreadId = tid;
    localStorage.setItem("chatbot_thread_id", tid);
    toggleSessions();
    loadHistory();
  }

  async function loadHistory() {
    try {
      const res = await fetch(
        `/chatbot/history/${encodeURIComponent(currentThreadId)}`,
      );
      const data = await res.json();
      if (data.history && data.history.length > 0) {
        const container = document.getElementById("chat-messages");
        // Keep only the first welcome message
        const welcome = container.firstElementChild;
        container.innerHTML = "";
        container.appendChild(welcome);

        data.history.forEach((msg) => {
          addBubble(msg.content, msg.role === "user" ? "user" : "bot");
        });
      }
    } catch (e) {
      console.error("Failed to load history", e);
    }
  }

  function toggleMaximize() {
    const win = document.getElementById("chat-window");
    if (isMaximized) {
      win.classList.remove("w-[800px]", "h-[80vh]", "max-w-[90vw]");
      win.classList.add("w-80", "sm:w-96", "h-[600px]");
      isMaximized = false;
    } else {
      win.classList.remove("w-80", "sm:w-96", "h-[600px]");
      win.classList.add("w-[800px]", "h-[80vh]", "max-w-[90vw]");
      isMaximized = true;
    }
  }

  function addBubble(text, sender) {
    const container = document.getElementById("chat-messages");
    const div = document.createElement("div");
    div.className = `flex w-full ${sender === "user" ? "justify-end" : "justify-start"}`;

    const bubble = document.createElement("div");
    bubble.className = `max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap ${
      sender === "user"
        ? "bg-indigo-600 text-white rounded-br-none"
        : "bg-base-100 text-base-content border border-base-300 rounded-bl-none"
    }`;
    bubble.textContent = text;

    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return bubble;
  }

  function startNewChat() {
    currentThreadId = "widget-" + Math.random().toString(36).substring(2, 11);
    localStorage.setItem("chatbot_thread_id", currentThreadId);
    const container = document.getElementById("chat-messages");
    container.innerHTML = `
                <div class="flex w-full justify-start">
                    <div class="max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap bg-base-100 text-base-content border border-base-300 rounded-bl-none">Hello! I am your medical assistant. How can I help you today?</div>
                </div>
            `;
    // Close overlay if open
    document.getElementById("sessions-overlay").classList.add("hidden");
  }

  async function handleRagSubmit(e) {
    e.preventDefault();
    if (isStreaming) return;

    const input = document.getElementById("rag-input");
    const text = input.value.trim();
    if (!text) return;

    addBubble(text, "user");
    input.value = "";
    input.disabled = true;

    // Create bot bubble for streaming
    const botBubble = addBubble("", "bot");
    isStreaming = true;

    try {
      const response = await fetch("/chatbot/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          query: text,
          thread_id: currentThreadId,
          stream: true,
        }),
      });

      if (!response.ok) throw new Error("Query failed");

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let accumulatedContent = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split("\n");

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const dataStr = line.substring(6);
            if (dataStr === "[DONE]") continue;

            try {
              const data = JSON.parse(dataStr);
              if (data.content) {
                accumulatedContent += data.content;
                botBubble.textContent = accumulatedContent;
                document.getElementById("chat-messages").scrollTop =
                  document.getElementById("chat-messages").scrollHeight;
              }
            } catch (e) {
              console.error("Error parsing SSE data:", e);
            }
          }
        }
      }
    } catch (err) {
      console.error(err);
      botBubble.textContent =
        "I'm having trouble connecting right now. Please try again later.";
      botBubble.classList.add("bg-red-50", "text-red-600");
    } finally {
      isStreaming = false;
      input.disabled = false;
      input.focus();
    }
  }
</script>
