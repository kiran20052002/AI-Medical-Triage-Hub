<div
  id="chatbot-widget"
  class="fixed bottom-6 right-6 z-50 flex flex-col items-end pointer-events-none"
>
  <!-- Chat Window -->
  <div
    id="chat-window"
    class="hidden pointer-events-auto bg-base-100 rounded-2xl shadow-2xl w-80 sm:w-96 h-[600px] mb-4 flex flex-col overflow-hidden border border-base-300 transition-all duration-300 ease-in-out transform origin-bottom-right"
  >
    <!-- Header -->
    <div
      class="bg-gradient-to-r from-indigo-500 to-indigo-700 p-4 flex justify-between items-center text-white"
    >
      <div class="flex items-center gap-2">
        <div class="bg-white/20 p-1.5 rounded-full">
          <!-- Bot Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 8V4H8" />
            <rect width="16" height="12" x="4" y="8" rx="2" />
            <path d="M2 14h2" />
            <path d="M20 14h2" />
            <path d="M15 13v2" />
            <path d="M9 13v2" />
          </svg>
        </div>
        <h3 class="font-semibold text-lg">Medical Assistant</h3>
      </div>
      <div class="flex items-center gap-1">
        <button
          onclick="clearChat()"
          class="hover:bg-white/20 p-1 rounded-full transition-colors"
          title="Clear History"
        >
          <!-- Trash2 Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 6h18" />
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
            <line x1="10" x2="10" y1="11" y2="17" />
            <line x1="14" x2="14" y1="11" y2="17" />
          </svg>
        </button>
        <button
          onclick="toggleMaximize()"
          title="Expand"
          class="hover:bg-white/20 p-1 rounded-full text-white text-xs"
        >
          <!-- Expand Icon (Custom) -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 3 21 3 21 9" />
            <polyline points="9 21 3 21 3 15" />
            <line x1="21" y1="3" x2="14" y2="10" />
            <line x1="3" y1="21" x2="10" y2="14" />
          </svg>
        </button>
        <button
          onclick="toggleChat()"
          class="hover:bg-white/20 p-1 rounded-full transition-colors"
        >
          <!-- X Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="M6 6 18 18" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div
      id="chat-messages"
      class="flex-1 p-4 overflow-y-auto bg-base-200 space-y-3"
    >
      <!-- Initial Message -->
      <div class="flex w-full justify-start">
        <div
          class="max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap bg-base-100 text-base-content border border-base-300 rounded-bl-none"
        >
          Hello! I am your medical assistant. How can I help you today?
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-base-100 border-t border-base-300">
      <form
        id="rag-chat-form"
        class="flex gap-2"
        onsubmit="handleRagSubmit(event)"
      >
        <input
          type="text"
          id="rag-input"
          class="flex-1 bg-base-200 text-base-content px-4 py-2.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500/50 border border-transparent transition-all"
          placeholder="Ask a health question..."
          required
          autocomplete="off"
        />
        <button
          type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white p-2.5 rounded-xl transition-all duration-200 shadow-md hover:shadow-lg flex-shrink-0"
        >
          <!-- Send Icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m22 2-7 20-4-9-9-4Z" />
            <path d="M22 2 11 13" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Toggle Button -->
  <button
    id="toggle-btn"
    onclick="toggleChat()"
    class="pointer-events-auto bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-full shadow-xl hover:shadow-2xl transition-all duration-300 transform hover:scale-110 flex items-center justify-center group"
  >
    <!-- MessageCircle Icon (Default) -->
    <svg
      id="icon-open"
      xmlns="http://www.w3.org/2000/svg"
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
    </svg>
    <!-- X Icon (Hidden by default, swapped in JS) -->
    <svg
      id="icon-close"
      class="hidden"
      xmlns="http://www.w3.org/2000/svg"
      width="28"
      height="28"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M18 6 6 18" />
      <path d="M6 6 18 18" />
    </svg>
  </button>
</div>

<script>
  let isMaximized = false;
  let isOpen = false;

  function toggleChat() {
    const win = document.getElementById("chat-window");
    const iconOpen = document.getElementById("icon-open");
    const iconClose = document.getElementById("icon-close");

    isOpen = !isOpen;
    if (isOpen) {
      win.classList.remove("hidden");
      iconOpen.classList.add("hidden");
      iconClose.classList.remove("hidden");
    } else {
      win.classList.add("hidden");
      iconOpen.classList.remove("hidden");
      iconClose.classList.add("hidden");
    }
  }

  function toggleMaximize() {
    const win = document.getElementById("chat-window");
    if (isMaximized) {
      win.classList.remove("w-[800px]", "h-[80vh]", "max-w-[90vw]");
      win.classList.add("w-80", "sm:w-96", "h-[600px]");
      isMaximized = false;
    } else {
      win.classList.remove("w-80", "sm:w-96", "h-[600px]");
      win.classList.add("w-[800px]", "h-[80vh]", "max-w-[90vw]");
      isMaximized = true;
    }
  }

  function addBubble(text, sender) {
    const container = document.getElementById("chat-messages");
    const div = document.createElement("div");
    div.className = `flex w-full ${sender === "user" ? "justify-end" : "justify-start"}`;

    const bubble = document.createElement("div");
    bubble.className = `max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap ${
      sender === "user"
        ? "bg-indigo-600 text-white rounded-br-none"
        : "bg-base-100 text-base-content border border-base-300 rounded-bl-none"
    }`;
    bubble.textContent = text;

    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    return div;
  }

  function clearChat() {
    if (confirm("Are you sure you want to clear the chat history?")) {
      const container = document.getElementById("chat-messages");
      container.innerHTML = `
                <div class="flex w-full justify-start">
                    <div class="max-w-[80%] p-3 rounded-2xl text-sm leading-relaxed shadow-sm whitespace-pre-wrap bg-base-100 text-base-content border border-base-300 rounded-bl-none">Hello! I am your medical assistant. How can I help you today?</div>
                </div>
            `;
    }
  }

  async function handleRagSubmit(e) {
    e.preventDefault();
    const input = document.getElementById("rag-input");
    const text = input.value.trim();
    if (!text) return;

    addBubble(text, "user");
    input.value = "";

    // Show loading animation (3 dots bounce)
    const container = document.getElementById("chat-messages");
    const loadingDiv = document.createElement("div");
    loadingDiv.id = "chat-loading";
    loadingDiv.className = "flex w-full justify-start";
    loadingDiv.innerHTML = `
            <div class="bg-base-100 p-3 rounded-2xl rounded-bl-none border border-base-300">
                <div class="flex space-x-1">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-75"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce delay-150"></div>
                </div>
            </div>`;
    container.appendChild(loadingDiv);
    container.scrollTop = container.scrollHeight;

    try {
      const res = await fetch("/chatbot/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text }),
      });
      const data = await res.json();

      document.getElementById("chat-loading").remove();

      if (data.response) {
        addBubble(data.response, "bot");
      } else {
        addBubble("I'm sorry, something went wrong.", "bot");
      }
    } catch (err) {
      console.error(err);
      document.getElementById("chat-loading")?.remove();
      addBubble(
        "I'm having trouble connecting right now. Please try again later.",
        "bot",
      );
    }
  }
</script>
