{% extends "base.html" %} {% block title %}Doctor Login - Medical Triage Hub{%
endblock %} {% block content %}

<div class="min-h-screen flex items-center justify-center bg-base-200 relative">
  <div
    class="card w-full max-w-sm shadow-2xl bg-neutral text-neutral-content backdrop-blur-xl border border-white/10 z-10 transition-all duration-300 hover:shadow-teal-900/20"
  >
    <form action="/auth/doctor-login" method="post" class="card-body">
      <div class="flex flex-col items-center mb-6">
        <div
          class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-500 flex items-center justify-center mb-4 shadow-lg shadow-teal-500/30 transform rotate-3 hover:rotate-6 transition-transform"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="white"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 1.5H8.25A2.25 2.25 0 006 3.75v16.5a2.25 2.25 0 002.25 2.25h7.5A2.25 2.25 0 0018 20.25V3.75a2.25 2.25 0 00-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"
            />
          </svg>
        </div>
        <h2 class="text-3xl font-bold tracking-wide">Doctor Portal</h2>
        <p class="text-teal-200/60 text-sm mt-1">Medical Staff Access</p>
      </div>

      {% if error %}
      <div
        class="alert alert-error shadow-lg mb-4 bg-red-500/20 border-red-500/20 text-red-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="stroke-current shrink-0 h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="form-control w-full space-y-4">
        <div class="group">
          <label class="label pt-0 pl-0">
            <span
              class="label-text text-teal-300/80 text-xs uppercase tracking-wider font-semibold"
              >Email</span
            >
          </label>
          <div
            class="relative transition-all duration-300 group-focus-within:scale-[1.01]"
          >
            <input
              type="email"
              name="email"
              placeholder="doctor@hospital.com"
              class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-teal-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
              required
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              class="w-5 h-5 absolute left-3 top-3.5 text-teal-400 group-focus-within:text-emerald-400 transition-colors"
            >
              <path
                d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"
              />
              <path
                d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"
              />
            </svg>
          </div>
        </div>

        <div class="group">
          <label class="label pt-0 pl-0">
            <span
              class="label-text text-teal-300/80 text-xs uppercase tracking-wider font-semibold"
              >Password</span
            >
          </label>
          <div
            class="relative transition-all duration-300 group-focus-within:scale-[1.01]"
          >
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-teal-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
              required
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              class="w-5 h-5 absolute left-3 top-3.5 text-teal-400 group-focus-within:text-emerald-400 transition-colors"
            >
              <path
                fill-rule="evenodd"
                d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
        </div>
      </div>

      <div class="form-control mt-8">
        <button
          type="submit"
          class="btn btn-primary w-full shadow-lg shadow-teal-900/40 border-none bg-gradient-to-r from-teal-600 to-emerald-500 hover:from-teal-500 hover:to-emerald-400 hover:shadow-teal-500/30 hover:scale-[1.02] transition-all duration-300 rounded-xl text-white font-bold tracking-wide"
        >
          Secure Login
        </button>
      </div>

      <div
        class="divider before:bg-teal-900/50 after:bg-teal-900/50 text-teal-500/50 text-xs"
      >
        Medical Triage Hub
      </div>

      <div class="text-center">
        <a
          href="/auth/login"
          class="link link-hover text-teal-400 text-sm hover:text-emerald-300 transition-colors"
          >Not a Doctor? Patient Login</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}
