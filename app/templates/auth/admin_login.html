{% extends "base.html" %} {% block title %}Admin Portal - Medical Triage Hub{%
endblock %} {% block content %}

<div class="min-h-screen flex items-center justify-center bg-base-200 relative">
  <div
    class="card w-full max-w-sm shadow-2xl bg-neutral text-neutral-content backdrop-blur-xl border border-white/10 z-10 transition-all duration-300 hover:shadow-purple-900/20"
  >
    <form action="/auth/admin-login" method="post" class="card-body">
      <div class="flex flex-col items-center mb-6">
        <div
          class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center mb-4 shadow-lg shadow-purple-500/30 transform rotate-3 hover:rotate-6 transition-transform"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="white"
            class="w-8 h-8"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z"
            />
          </svg>
        </div>
        <h2 class="text-3xl font-bold tracking-wide">Admin Access</h2>
        <p class="text-indigo-200/60 text-sm mt-1">System Management Console</p>
      </div>

      {% if error %}
      <div
        class="alert alert-error shadow-lg mb-4 bg-red-500/20 border-red-500/20 text-red-200"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="stroke-current shrink-0 h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="form-control w-full space-y-4">
        <div class="group">
          <label class="label pt-0 pl-0">
            <span
              class="label-text text-indigo-300/80 text-xs uppercase tracking-wider font-semibold"
              >Email</span
            >
          </label>
          <div
            class="relative transition-all duration-300 group-focus-within:scale-[1.01]"
          >
            <input
              type="email"
              name="username"
              placeholder="admin@medicalhub.com"
              class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-purple-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
              required
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              class="w-5 h-5 absolute left-3 top-3.5 text-indigo-400 group-focus-within:text-purple-400 transition-colors"
            >
              <path
                d="M3 4a2 2 0 00-2 2v1.161l8.441 4.221a1.25 1.25 0 001.118 0L19 7.162V6a2 2 0 00-2-2H3z"
              />
              <path
                d="M19 8.839l-7.77 3.885a2.75 2.75 0 01-2.46 0L1 8.839V14a2 2 0 002 2h14a2 2 0 002-2V8.839z"
              />
            </svg>
          </div>
        </div>

        <div class="group">
          <label class="label pt-0 pl-0">
            <span
              class="label-text text-indigo-300/80 text-xs uppercase tracking-wider font-semibold"
              >Password</span
            >
          </label>
          <div
            class="relative transition-all duration-300 group-focus-within:scale-[1.01]"
          >
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-purple-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
              required
            />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              class="w-5 h-5 absolute left-3 top-3.5 text-indigo-400 group-focus-within:text-purple-400 transition-colors"
            >
              <path
                fill-rule="evenodd"
                d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
        </div>
      </div>

      <div class="form-control mt-8">
        <button
          type="submit"
          class="btn btn-primary w-full shadow-lg shadow-purple-900/40 border-none bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 hover:shadow-purple-700/50 hover:scale-[1.02] transition-all duration-300 rounded-xl text-white font-bold tracking-wide"
        >
          Authenticate
        </button>
      </div>

      <div
        class="divider before:bg-indigo-900/50 after:bg-indigo-900/50 text-indigo-500/50 text-xs"
      >
        Medical Triage Hub System
      </div>

      <div class="text-center">
        <a
          href="/auth/login"
          class="link link-hover text-indigo-400 text-sm hover:text-purple-300 transition-colors"
          >← Back to Login</a
        >
      </div>
    </form>
  </div>
</div>
{% endblock %}
