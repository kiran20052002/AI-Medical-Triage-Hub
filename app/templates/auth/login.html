{% extends "base.html" %}

{% block title %}Patient Login - Medical Triage Hub{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-base-200 relative">
  
  <div class="card w-full max-w-sm shadow-2xl bg-neutral text-neutral-content backdrop-blur-xl border border-white/10 z-10 transition-all duration-300 hover:shadow-indigo-900/20">
    <form action="/auth/login" method="post" class="card-body">
      
      <div class="flex flex-col items-center mb-6">
          
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#6366f1] to-[#818cf8] flex items-center justify-center mb-4 shadow-lg shadow-indigo-500/30 transform -rotate-3 hover:rotate-0 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
            </svg>
          </div>
          <h2 class="text-3xl font-bold tracking-wide">Patient Portal</h2>
          <p class="text-indigo-200/60 text-sm mt-1">Access Your Health Dashboard</p>
      </div>

      {% if error %}
      <div class="alert alert-error shadow-lg mb-4 bg-red-500/20 border-red-500/20 text-red-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="form-control w-full space-y-4">
        
        <div class="group">
            <label class="label pt-0 pl-0">
              <span class="label-text text-indigo-300/80 text-xs uppercase tracking-wider font-semibold">Email</span>
            </label>
            <div class="relative transition-all duration-300 group-focus-within:scale-[1.01]">
                <input
                    type="email"
                    name="username"
                    placeholder="patient@email.com"
                    class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-indigo-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
                    required
                />
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 absolute left-3 top-3.5 text-indigo-400 group-focus-within:text-violet-400 transition-colors">
                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                </svg>
            </div>
        </div>

        
        <div class="group">
            <label class="label pt-0 pl-0">
              <span class="label-text text-indigo-300/80 text-xs uppercase tracking-wider font-semibold">Password</span>
            </label>
            <div class="relative transition-all duration-300 group-focus-within:scale-[1.01]">
                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-indigo-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
                    required
                />
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 absolute left-3 top-3.5 text-indigo-400 group-focus-within:text-violet-400 transition-colors">
                    <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>
      </div>

      <div class="form-control mt-8">
       
        <button type="submit" class="btn btn-primary w-full shadow-lg shadow-indigo-900/40 border-none bg-[#6366f1] hover:bg-[#4f46e5] hover:shadow-indigo-500/30 hover:scale-[1.02] transition-all duration-300 rounded-xl text-white font-bold tracking-wide">
          Login
        </button>
      </div>

      <div class="divider before:bg-indigo-900/50 after:bg-indigo-900/50 text-indigo-500/50 text-xs">New to Medical Hub?</div>
      
      <a href="/auth/signup" class="btn btn-outline border-indigo-500/30 text-indigo-300 hover:bg-indigo-600/20 hover:border-indigo-400 w-full rounded-xl group relative overflow-hidden">
          <span class="relative z-10">Create Account</span>
      </a>

      <div class="mt-4 flex flex-col gap-2 text-center">
          <a href="/auth/doctor-login" class="link link-hover text-indigo-400 text-sm hover:text-violet-300">Doctor Login</a>
          <a href="/auth/admin-login" class="link link-hover text-gray-500 text-xs hover:text-gray-300">Admin Login</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
