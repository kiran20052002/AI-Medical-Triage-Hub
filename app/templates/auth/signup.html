{% extends "base.html" %}

{% block title %}Sign Up - Medical Triage Hub{% endblock %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-base-200 relative">
  
  <div class="card w-full max-w-sm shadow-2xl bg-neutral text-neutral-content backdrop-blur-xl border border-white/10 z-10 transition-all duration-300 hover:shadow-orange-900/20">
    <form action="/auth/signup" method="post" class="card-body">
      
      <div class="flex flex-col items-center mb-6">
          
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-600 to-amber-500 flex items-center justify-center mb-4 shadow-lg shadow-orange-500/30 transform hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="w-8 h-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.766z" />
            </svg>
          </div>
          <h2 class="text-3xl font-bold tracking-wide">Join Us</h2>
          <p class="text-orange-200/60 text-sm mt-1">Create Your New Account</p>
      </div>

      {% if error %}
      <div class="alert alert-error shadow-lg mb-4 bg-red-500/20 border-red-500/20 text-red-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <div class="form-control w-full space-y-4">
        
        <div class="group">
            <label class="label pt-0 pl-0">
              <span class="label-text text-orange-300/80 text-xs uppercase tracking-wider font-semibold">Email</span>
            </label>
            <div class="relative transition-all duration-300 group-focus-within:scale-[1.01]">
                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-orange-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
                    required
                />
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 absolute left-3 top-3.5 text-orange-400 group-focus-within:text-amber-400 transition-colors">
                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z" />
                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z" />
                </svg>
            </div>
        </div>

        
        <div class="group">
            <label class="label pt-0 pl-0">
              <span class="label-text text-orange-300/80 text-xs uppercase tracking-wider font-semibold">Password</span>
            </label>
            <div class="relative transition-all duration-300 group-focus-within:scale-[1.01]">
                <input
                    type="password"
                    name="password"
                    placeholder="••••••••"
                    class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-orange-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
                    required
                />
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 absolute left-3 top-3.5 text-orange-400 group-focus-within:text-amber-400 transition-colors">
                    <path fill-rule="evenodd" d="M10 1a4.5 4.5 0 00-4.5 4.5V9H5a2 2 0 00-2 2v6a2 2 0 002 2h10a2 2 0 002-2v-6a2 2 0 00-2-2h-.5V5.5A4.5 4.5 0 0010 1zm3 8V5.5a3 3 0 10-6 0V9h6z" clip-rule="evenodd" />
                </svg>
            </div>
        </div>

        
        <div class="group">
            <label class="label pt-0 pl-0">
              <span class="label-text text-orange-300/80 text-xs uppercase tracking-wider font-semibold">I am a</span>
            </label>
            <select name="role" id="roleSelect" class="select select-bordered w-full bg-base-100/10 border-white/10 focus:border-orange-500 focus:bg-base-100/20 focus:outline-none transition-all rounded-xl">
                <option value="patient" selected>Patient</option>
                <option value="doctor">Doctor</option>
            </select>
        </div>

        
        <div class="group hidden" id="specialistField">
            <label class="label pt-0 pl-0">
              <span class="label-text text-orange-300/80 text-xs uppercase tracking-wider font-semibold">Specialization</span>
            </label>
            <div class="relative transition-all duration-300 group-focus-within:scale-[1.01]">
                <input
                    type="text"
                    name="specialist"
                    placeholder="e.g. Cardiology, Neurology"
                    class="input input-bordered w-full bg-base-100/10 border-white/10 focus:border-orange-500 focus:bg-base-100/20 focus:outline-none transition-all pl-10 rounded-xl"
                />
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5 absolute left-3 top-3.5 text-orange-400 group-focus-within:text-amber-400 transition-colors">
                    <path d="M9 2a2 2 0 00-2 2v8a2 2 0 002 2h6a2 2 0 002-2V6.414A2 2 0 0016.414 5L14 2.586A2 2 0 0012.586 2H9z" />
                    <path d="M3 8a2 2 0 012-2v10h8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z" />
                </svg>
            </div>
        </div>

      </div>

      <div class="form-control mt-8">
        <button type="submit" class="btn btn-primary w-full shadow-lg shadow-orange-900/40 border-none bg-gradient-to-r from-orange-600 to-amber-500 hover:from-orange-500 hover:to-amber-400 hover:shadow-orange-500/30 hover:scale-[1.02] transition-all duration-300 rounded-xl text-white font-bold tracking-wide">
          Get Started
        </button>
      </div>

      <div class="divider before:bg-orange-900/50 after:bg-orange-900/50 text-orange-500/50 text-xs">Already have an account?</div>
      
      <a href="/auth/login" class="btn btn-outline border-orange-500/30 text-orange-300 hover:bg-orange-600/20 hover:border-orange-400 w-full rounded-xl group relative overflow-hidden">
          <span class="relative z-10">Log In</span>
      </a>
    </form>
  </div>
</div>

<script>
    const roleSelect = document.getElementById('roleSelect');
    const specialistField = document.getElementById('specialistField');

    roleSelect.addEventListener('change', (e) => {
        if (e.target.value === 'doctor') {
            specialistField.classList.remove('hidden');
            specialistField.querySelector('input').setAttribute('required', 'true');
        } else {
            specialistField.classList.add('hidden');
            specialistField.querySelector('input').removeAttribute('required');
        }
    });
</script>
{% endblock %}
